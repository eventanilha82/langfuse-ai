[project]
name = "langfuse-workshop-backend"
version = "0.1.0"
description = "FastAPI backend for a Langfuse hands-on workshop."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-dotenv>=1.0.1",
  "langfuse>=4.0.0",
  "openai-agents>=0.17.4",
  "openinference-instrumentation-openai-agents>=1.5.1",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
